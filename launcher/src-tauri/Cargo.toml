[package]
name = "fagrishot"
autobins = false
version = "0.1.0"
description = "FagriShot launcher and local game build tools"
edition = "2021"
authors = ["thunderq10", "Goldoire and upstream contributors"]
license = "GPL-3.0-or-later"

[[bin]]
name = "FagriShotLauncher"
path = "src/fagrishot.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
